name: Android Phase 0 spike

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-0.10-phase0

permissions:
  contents: read

concurrency:
  group: android-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # GitHub-hosted ubuntu-latest has no /dev/kvm. Emulator 37 refuses
      # "-accel off" unless TCG is explicitly allowed; this keeps the same
      # x86_64 API 34 image and the same functional assertions.
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Add Rust Android targets
        run: |
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare generated Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          chmod +x scripts/android-phase0-prepare.sh
          scripts/android-phase0-prepare.sh x86_64

      - name: Build x86_64 debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          pnpm tauri android build --debug --apk -t x86_64 --ci

      - name: Inspect APK
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'lib/x86_64/(libxray|libkartoshka_vpn_lib)\.so'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion"

      - name: Emulator spike (x86_64 API 34, TCG)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1800
          disable-animations: true
          script: bash scripts/android-phase0-emulator-test.sh

      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-phase0-x86_64
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            /tmp/kpv-http-8080.log
            /tmp/kpv-http-8081.log
            /tmp/kpv-response.txt
          if-no-files-found: warn
