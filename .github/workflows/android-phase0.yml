name: Android Phase 0 spike

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-0.10-phase0

permissions:
  contents: read

concurrency:
  group: android-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Add Rust Android targets
        run: |
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare generated Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          chmod +x scripts/android-phase0-prepare.sh
          scripts/android-phase0-prepare.sh x86_64

      - name: Build x86_64 debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          pnpm tauri android build --debug --apk -t x86_64 --ci

      - name: Inspect APK
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'lib/x86_64/(libxray|libkartoshka_vpn_lib)\.so'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion"

      - name: Emulator spike
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            adb install -r "$APK"
            adb shell appops set ru.kartoshka.vpn ACTIVATE_VPN allow
            adb shell pm grant ru.kartoshka.vpn android.permission.POST_NOTIFICATIONS || true
            python3 -m http.server 8080 --bind 0.0.0.0 >/tmp/kpv-http.log 2>&1 &
            HTTP_PID=$!
            trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
            adb logcat -c
            adb shell am start -n ru.kartoshka.vpn/.MainActivity
            sleep 25
            echo '--- phase0 logcat ---'
            adb logcat -d -s KPV_PHASE0:* | tail -80
            adb logcat -d -s KPV_PHASE0:* | grep -q 'xray version:'
            adb logcat -d -s KPV_PHASE0:* | grep -q 'tunnel started fd='
            adb shell dumpsys activity services ru.kartoshka.vpn | grep -q 'KartoshkaVpnService'
            adb shell ps -A | grep -E 'libxray|xray' || true
            echo '--- traffic through TUN ---'
            adb shell "toybox wget -qO- http://10.0.2.2:8080/ 2>/dev/null || echo -e 'GET / HTTP/1.0\r\nHost: 10.0.2.2\r\n\r\n' | toybox nc 10.0.2.2 8080" > /tmp/kpv-response.txt || true
            cat /tmp/kpv-response.txt | head -20
            grep -q 'GET / HTTP/1.0' /tmp/kpv-http.log
            echo '--- activity close check ---'
            adb shell input keyevent 3
            sleep 4
            adb shell dumpsys activity services ru.kartoshka.vpn | grep -q 'KartoshkaVpnService'
            adb shell ps -A | grep -E 'libxray|xray'
            echo 'PHASE0_EMULATOR_OK'

      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-phase0-x86_64
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            /tmp/kpv-http.log
            /tmp/kpv-response.txt
          if-no-files-found: warn
