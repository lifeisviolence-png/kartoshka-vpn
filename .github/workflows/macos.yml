name: macOS build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/macos-0.9.8
    tags:
      - 'v*'

permissions:
  contents: write

env:
  XRAY_VERSION: 26.10.31
  XRAY_SHA256_ARM64: 0a05dca3bd311b0bc5a89c7ce56350cab1e829e131e4b2bcd48eb304fac07e9a
  XRAY_SHA256_X64: 37c60b63c77ef5edcfb46a0d70349f7d96e0c132e6a356ead4fd20aeeacc5c75

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Download and verify Xray for both Mac architectures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries/xray-assets src-tauri/binaries/licenses /tmp/xray
          curl -fsSL -o /tmp/xray-arm64.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-macos-arm64-v8a.zip"
          curl -fsSL -o /tmp/xray-x64.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-macos-64.zip"
          echo "${XRAY_SHA256_ARM64}  /tmp/xray-arm64.zip" | shasum -a 256 -c -
          echo "${XRAY_SHA256_X64}  /tmp/xray-x64.zip" | shasum -a 256 -c -
          unzip -q /tmp/xray-arm64.zip -d /tmp/xray/arm64
          unzip -q /tmp/xray-x64.zip -d /tmp/xray/x64
          lipo -create /tmp/xray/arm64/xray /tmp/xray/x64/xray -output src-tauri/binaries/xray-universal-apple-darwin
          chmod +x src-tauri/binaries/xray-universal-apple-darwin
          cp src-tauri/binaries/xray-universal-apple-darwin src-tauri/binaries/xray-aarch64-apple-darwin
          cp src-tauri/binaries/xray-universal-apple-darwin src-tauri/binaries/xray-x86_64-apple-darwin
          cp /tmp/xray/arm64/geoip.dat /tmp/xray/arm64/geosite.dat src-tauri/binaries/xray-assets/
          cp /tmp/xray/arm64/LICENSE src-tauri/binaries/licenses/Xray-MPL-2.0.txt
          cp /tmp/xray/arm64/README.md src-tauri/binaries/licenses/Xray-README.md
          lipo -info src-tauri/binaries/xray-universal-apple-darwin
      - name: Build frontend and run JavaScript suites
        env:
          XRAY_TEST_BIN: ${{ github.workspace }}/src-tauri/binaries/xray-universal-apple-darwin
          XRAY_LOCATION_ASSET: ${{ github.workspace }}/src-tauri/binaries/xray-assets
        run: |
          set -euo pipefail
          pnpm run build
          node --test tests/xray-config.test.js tests/xray-proxy.integration.test.js
          node --test tests/frontend-regressions.test.js
          node --test tests/countries.test.js tests/state-model.test.js tests/i18n.test.js tests/version.test.js
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build universal DMG
        env:
          RUST_BACKTRACE: 1
        run: |
          set -euo pipefail
          pnpm tauri build --target universal-apple-darwin --bundles dmg
      - name: Inspect the DMG and bundled sidecar
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg" || { echo 'DMG not found'; exit 1; }
          mountpoint=$(mktemp -d /tmp/kartoshka-dmg.XXXXXX)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" >/dev/null
          trap 'hdiutil detach "$mountpoint" -quiet || true' EXIT
          app=$(find "$mountpoint" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app" || { echo 'App bundle not found in DMG'; exit 1; }
          test -x "$app/Contents/MacOS/kartoshka-vpn"
          test -x "$app/Contents/MacOS/xray"
          test -f "$app/Contents/Resources/xray-assets/geoip.dat"
          test -f "$app/Contents/Resources/xray-assets/geosite.dat"
          test -f "$app/Contents/Resources/licenses/Xray-MPL-2.0.txt"
          test -f "$app/Contents/Resources/country-ipv4.bin.gz"
          file "$app/Contents/MacOS/kartoshka-vpn"
          file "$app/Contents/MacOS/xray"
          shasum -a 256 "$dmg"
          version=$(node -p "require('./package.json').version")
          cp "$dmg" "KartoshkaVPN_${version}_universal.dmg"
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: kartoshka-vpn-universal-apple-darwin
          path: KartoshkaVPN_*_universal.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: kartoshka-vpn-universal-apple-darwin
          path: release-assets
      - name: Upload DMG to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find release-assets -name '*.dmg' -print -quit)
          test -n "$dmg" || { echo 'DMG artifact is empty'; exit 1; }
          name=$(basename "$dmg")
          cp "$dmg" "release-assets/$name"
          ( cd release-assets && sha256sum "$name" > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt )
          tag="${GITHUB_REF_NAME}"
          for _ in $(seq 1 60); do
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then break; fi
            sleep 20
          done
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$tag" "release-assets/$name" "release-assets/SHA256SUMS-macos.txt" -R "$GITHUB_REPOSITORY" --clobber