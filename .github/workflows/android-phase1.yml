name: Android Phase 1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-0.10-phase1

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_I_WANT_MY_TCG: "yes"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
      - name: Add Rust Android target
        run: |
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked
      - run: pnpm install --frozen-lockfile
      - name: Prepare generated Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          chmod +x scripts/android-phase0-prepare.sh scripts/check-16kb.sh
          scripts/android-phase0-prepare.sh x86_64
      - name: Build debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          pnpm tauri android build --debug --apk -t x86_64 --ci
      - name: Inspect APK and 16KB alignment
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion"
          bash scripts/check-16kb.sh "$APK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-phase1-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error

  release-size:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Add Rust Android target
        run: |
          rustup target add x86_64-linux-android aarch64-linux-android
          cargo install cargo-ndk --locked
      - run: pnpm install --frozen-lockfile
      - name: Prepare and debug-sign the CI release variant
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          scripts/android-phase0-prepare.sh ${{ matrix.abi }}
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text()
          if 'signingConfig = signingConfigs.getByName("debug")' not in s:
              s = s.replace('buildTypes {\n            getByName("release") {',
                            'buildTypes {\n            getByName("release") {\n                signingConfig = signingConfigs.getByName("debug")', 1)
          p.write_text(s)
          PY
      - name: Build release APK with LTO and strip
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          pnpm tauri android build --apk -t ${{ matrix.abi }} --ci
      - name: Measure sizes and check 16KB alignment
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$APK"
          echo "ABI=${{ matrix.abi }}"
          echo "APK=$APK"
          stat -c 'APK_BYTES=%s' "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | grep -E 'lib/.*\.so' || true
          bash scripts/check-16kb.sh "$APK" | tee /tmp/kpv-16kb.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-phase1-release-size-${{ matrix.abi }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            /tmp/kpv-16kb.txt
          if-no-files-found: warn

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-phase1-debug-apk
          path: /tmp/kpv-apk
      - name: Install emulator and system image
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "emulator" \
            "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - name: Enable KVM for the emulator
        run: |
          ls -l /dev/kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
      - name: Run emulator test
        env:
          KPV_API_LEVEL: ${{ matrix.api }}
          KPV_APK: /tmp/kpv-apk/app-universal-debug.apk
          KPV_TEST_MODE: ${{ matrix.api == 34 && 'full' || 'smoke' }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            -n "kpv-api${{ matrix.api }}" \
            -k "system-images;android-${{ matrix.api }};google_apis;x86_64" \
            -d pixel_6 \
            --path "$ANDROID_AVD_HOME/kpv-api${{ matrix.api }}.avd" \
            --force
          test -f "$ANDROID_AVD_HOME/kpv-api${{ matrix.api }}.ini"
          emulator -avd "kpv-api${{ matrix.api }}" \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot -no-metrics -accel auto -memory 2048 \
            >/tmp/kpv-emulator.log 2>&1 &
          timeout 300 adb wait-for-device
          ready=0
          for _ in $(seq 1 180); do
            boot="$(timeout 30 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            pm="$(timeout 30 adb shell cmd package list packages 2>/dev/null | head -1 || true)"
            input="$(timeout 30 adb shell input keyevent 82 2>&1 || true)"
            if [ "$boot" = "1" ] && printf '%s' "$pm" | grep -q '^package:' \
              && ! printf '%s' "$input" | grep -qE "Broken pipe|Can't find service"; then
              ready=1; echo "emulator services ready after $((_ * 5))s"; break
            fi
            sleep 5
          done
          if [ "$ready" != 1 ]; then
            echo 'ERROR: emulator services did not become ready'
            tail -100 /tmp/kpv-emulator.log || true
            exit 1
          fi
          timeout 30 adb shell wm dismiss-keyguard || true
          chmod +x scripts/android-phase1-emulator-test.sh
          bash scripts/android-phase1-emulator-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-phase1-logs-api${{ matrix.api }}
          path: |
            /tmp/kpv-http-8080.log
            /tmp/kpv-http-8081.log
            /tmp/kpv-response.txt
            /tmp/kpv-client.err
            /tmp/kpv-logcat.txt
            /tmp/kpv-full-logcat.txt
            /tmp/kpv-network.txt
            /tmp/kpv-emulator.log
          if-no-files-found: warn
