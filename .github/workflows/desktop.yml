name: Desktop builds

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  XRAY_VERSION: 26.10.31
  XRAY_SHA256: 2e04a9995a6f2ad1b28c0bb25c708ecb2695e43a1c9c7889c4b6ac2b48cf7a6a
  TARGET: x86_64-pc-windows-msvc
  RULES_REV: b40845fed59ac2dd60c9c5f7b598dce2b5a2d46f

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Download and verify official Xray and licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'Xray-windows-64.zip'
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:XRAY_SHA256) { throw 'Xray archive SHA256 mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'xray-package'
          Expand-Archive -Path $zip -DestinationPath $extract
          New-Item -ItemType Directory -Force src-tauri/binaries/xray-assets,src-tauri/binaries/licenses | Out-Null
          Copy-Item "$extract/xray.exe" "src-tauri/binaries/xray-$env:TARGET.exe"
          Copy-Item "$extract/geoip.dat", "$extract/geosite.dat" src-tauri/binaries/xray-assets/
          Copy-Item "$extract/LICENSE" src-tauri/binaries/licenses/Xray-MPL-2.0.txt
          Copy-Item "$extract/README.md" src-tauri/binaries/licenses/Xray-README.md
          # We do not ship wintun.dll or TUN support. These geo-data licenses are pinned
          # to a source revision available by the Xray release date; final legal review is required.
          $hashes = @{
            'LICENSE' = '3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986'
            'LICENSE-GeoSite' = '4d3730dbc49d4cde94cc9adb07e29dbf4afefac68705af830809b8b464425719'
            'LICENSE-GeoSite-inherit' = 'b9d84a22870d3f21c91a4c6e410c9cc51d00902f5233ad0c84011479244bf7d2'
            'README.md' = 'd2a6344e2a4e3a57cfdb2eed05fcc7419e92936b0f4b810766338040ad854f7c'
          }
          foreach ($name in $hashes.Keys) {
            $dst = "src-tauri/binaries/licenses/Xray-rules-$name.txt"
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/XTLS/Xray-rules-dat/$env:RULES_REV/$name" -OutFile $dst
            if ((Get-FileHash $dst -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hashes[$name]) { throw "Geo-data license checksum mismatch: $name" }
          }
          if (-not (Select-String -Quiet -Path src-tauri/binaries/licenses/Xray-MPL-2.0.txt -Pattern 'Mozilla Public License Version 2.0')) { throw 'Missing Xray MPL-2.0 license' }
          Write-Output "Xray archive SHA256 $env:XRAY_SHA256 verified; wintun.dll is not shipped"
      - name: Generate desktop icons
        run: pnpm tauri icon src-tauri/icons/potato-mark.svg
      - name: Build frontend for Rust test harness
        run: pnpm run build
      - name: Build executable for watchdog process tests
        run: cargo build --manifest-path src-tauri/Cargo.toml --target ${{ env.TARGET }}
      - name: JavaScript config and real Xray integration tests
        shell: pwsh
        run: |
          $env:XRAY_TEST_BIN = (Resolve-Path "src-tauri/binaries/xray-$env:TARGET.exe").Path
          $env:XRAY_LOCATION_ASSET = (Resolve-Path 'src-tauri/binaries/xray-assets').Path
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
          foreach ($dir in @((Join-Path $gitRoot 'usr/bin'), (Join-Path $gitRoot 'mingw64/bin'))) {
            if (Test-Path (Join-Path $dir 'openssl.exe')) { $env:PATH = "$dir;$env:PATH"; break }
          }
          if (-not (Get-Command openssl.exe -ErrorAction SilentlyContinue)) { throw 'OpenSSL is required for real Xray TLS tests' }
          node --test tests/xray-config.test.js tests/xray-proxy.integration.test.js
          if ($LASTEXITCODE -ne 0) { throw "JavaScript Xray tests failed ($LASTEXITCODE)" }
          node --test tests/frontend-regressions.test.js
          if ($LASTEXITCODE -ne 0) { throw "Frontend regression tests failed ($LASTEXITCODE)" }
      - name: Real Windows registry, watchdog crash and loopback Xray smoke
        shell: pwsh
        env:
          RUST_BACKTRACE: 1
          KARTOVPN_DISPOSABLE_WINDOWS_CI: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne "github-hosted") { throw "Registry tests require a disposable GitHub-hosted runner" }
          $env:KARTOVPN_WATCHDOG_TEST_EXE = (Resolve-Path "src-tauri/target/$env:TARGET/debug/kartoshka-vpn.exe").Path
          $env:XRAY_TEST_BINARY = (Resolve-Path "src-tauri/binaries/xray-$env:TARGET.exe").Path
          $env:XRAY_TEST_ASSETS = (Resolve-Path 'src-tauri/binaries/xray-assets').Path
          cargo test --manifest-path src-tauri/Cargo.toml --target $env:TARGET --no-run
          if ($LASTEXITCODE -ne 0) { throw "Windows test compilation failed ($LASTEXITCODE)" }
          $testExe = Get-ChildItem "src-tauri/target/$env:TARGET/debug/deps/kartoshka_vpn-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $testExe) { throw 'Windows test harness was not found' }
          # The GitHub runner's Job can prohibit CREATE_BREAKAWAY_FROM_JOB. A
          # same-user interactive scheduled task is an independent launch path,
          # not a relaxation of the production watchdog's IsProcessInJob check.
          # S4U is deliberately not used: Microsoft documents no encrypted-file
          # access, which would invalidate DPAPI coverage. SYSTEM has another HKCU.
          $taskName = 'kartoshka-native-smoke-' + [guid]::NewGuid().ToString('N')
          $work = Join-Path $env:RUNNER_TEMP $taskName
          New-Item -ItemType Directory -Path $work | Out-Null
          $config = Join-Path $work 'config.json'
          $script = Join-Path $work 'run.ps1'
          $result = Join-Path $work 'exit.txt'
          $started = Join-Path $work 'started.txt'
          $log = Join-Path $work 'windows-smoke.log'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          @{ exe=$testExe.FullName; watcher=$env:KARTOVPN_WATCHDOG_TEST_EXE; xray=$env:XRAY_TEST_BINARY; assets=$env:XRAY_TEST_ASSETS; sid=$identity.User.Value; log=$log; result=$result; started=$started } | ConvertTo-Json | Set-Content -Encoding UTF8 $config
          @'
          param([string]$Config)
          $ErrorActionPreference = 'Continue'
          $c = Get-Content -Raw $Config | ConvertFrom-Json
          $code = 1
          try {
            Set-Content -Path $c.started -Value $PID
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            if ($sid -ne $c.sid) { throw "Scheduled task SID mismatch: $sid, expected $($c.sid)" }
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class JobProbe { [DllImport("kernel32.dll")] public static extern IntPtr GetCurrentProcess(); [DllImport("kernel32.dll", SetLastError=true)] public static extern bool IsProcessInJob(IntPtr p, IntPtr j, out bool result); }'
            $inJob = $false
            if (-not [JobProbe]::IsProcessInJob([JobProbe]::GetCurrentProcess(), [IntPtr]::Zero, [ref]$inJob)) { throw 'Cannot inspect scheduled task Job Object' }
            "Task SID=$sid; task process IsProcessInJob=$inJob; watchdog independence is separately verified" | Out-File -Encoding utf8 $c.log
            $env:CI='true'; $env:GITHUB_ACTIONS='true'; $env:RUNNER_ENVIRONMENT='github-hosted'; $env:KARTOVPN_DISPOSABLE_WINDOWS_CI='1'
            $env:RUST_BACKTRACE='1'; $env:KARTOVPN_WATCHDOG_TEST_EXE=$c.watcher; $env:XRAY_TEST_BINARY=$c.xray; $env:XRAY_TEST_ASSETS=$c.assets
            # Redirect to a file instead of piping: a leftover child holding the
            # console handle must not keep the PowerShell pipeline (and the task) open.
            & $c.exe windows_native_tests:: --nocapture --test-threads=1 *> $c.log
            $code = $LASTEXITCODE
          } catch { $_ | Out-String | Out-File -Encoding utf8 $c.log -Append; $code = 1 }
          finally { Set-Content -Path $c.result -Value $code }
          '@ | Set-Content -Encoding UTF8 $script
          try {
            $action = New-ScheduledTaskAction -Execute (Get-Command pwsh).Source -Argument "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$script`" -Config `"$config`"" -WorkingDirectory (Get-Location).Path
            $principal = New-ScheduledTaskPrincipal -UserId $identity.Name -LogonType Interactive -RunLevel Highest
            Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Force | Out-Null
            Start-ScheduledTask -TaskName $taskName
            $startDeadline = (Get-Date).AddSeconds(30)
            while (-not (Test-Path $started) -and (Get-Date) -lt $startDeadline) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path $started)) { $info = Get-ScheduledTaskInfo -TaskName $taskName | Out-String; throw "Same-user interactive scheduled task did not start. An interactive runner session is required; no S4U/SYSTEM fallback. $info" }
            $deadline = (Get-Date).AddMinutes(5)
            while (-not (Test-Path $result) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
            if (-not (Test-Path $result)) { throw 'Windows native scheduled test timed out' }
            $code = [int](Get-Content -Raw $result).Trim()
            if (Test-Path $log) { Get-Content $log | Tee-Object -FilePath windows-smoke.log }
            if ($code -ne 0) { throw "Windows native smoke failed ($code); see windows-smoke.log" }
          } finally {
            if (Test-Path $started) { $pidText = (Get-Content -Raw $started).Trim(); if ($pidText -match '^\d+$' -and -not (Test-Path $result)) { & taskkill.exe /PID $pidText /T /F 2>&1 | Out-Null } }
            Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            Get-Process -Name 'kartoshka-vpn' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            if ((Test-Path $log) -and -not (Test-Path windows-smoke.log)) { Copy-Item $log windows-smoke.log }
            Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-log
          path: windows-smoke.log
          if-no-files-found: warn
      - name: Build and validate Tauri app
        env:
          RUST_BACKTRACE: 1
        run: pnpm tauri build --target ${{ env.TARGET }}
      - name: Inspect installed bundle and load geodata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem "src-tauri/target/$env:TARGET/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $dest = Join-Path $env:RUNNER_TEMP 'kartoshka-installed'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS installation failed: $($result.ExitCode)" }
          foreach ($file in @('xray.exe','xray-assets/geoip.dat','xray-assets/geosite.dat','licenses/Xray-MPL-2.0.txt','licenses/Xray-rules-LICENSE.txt','licenses/Xray-rules-LICENSE-GeoSite.txt','licenses/Xray-rules-LICENSE-GeoSite-inherit.txt')) {
            if (-not (Test-Path (Join-Path $dest $file))) { throw "Installed file missing: $file" }
          }
          $env:XRAY_LOCATION_ASSET = Join-Path $dest 'xray-assets'
          & (Join-Path $dest 'xray.exe') run -test -config (Resolve-Path tests/windows-geodata.json).Path
          if ($LASTEXITCODE -ne 0) { throw 'Installed Xray could not load installed geodata' }
          Write-Output 'PASS installed sidecar, geodata and licenses verified'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kartoshka-vpn-x86_64-pc-windows-msvc
          path: src-tauri/target/${{ env.TARGET }}/release/bundle/**

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: kartoshka-vpn-*
      - name: Normalise the installer file name
        shell: bash
        run: |
          set -euo pipefail
          installer=$(find release-assets -name '*-setup.exe' -print -quit)
          test -n "$installer" || { echo 'no NSIS installer in the artifact'; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          cp "$installer" "release-assets/KartoshkaVPN_${version}_x64-setup.exe"
          find release-assets -mindepth 2 -name '*-setup.exe' -delete
          ls -l release-assets
      - name: Publish prerelease assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: release-assets/**/*
